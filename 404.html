<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found | Morne Studio</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#14231c" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Self-contained so it renders at any URL depth -->
    <style>
      @font-face { font-family: "Bricolage Grotesque"; font-weight: 500 800; font-display: swap; src: url("/assets/fonts/bricolage-grotesque-latin.woff2") format("woff2"); }
      @font-face { font-family: "Instrument Sans"; font-weight: 400 600; font-display: swap; src: url("/assets/fonts/instrument-sans-latin.woff2") format("woff2"); }
      :root {
        --ink: #14231c;
        --ink-2: #44524b;
        --paper: #f5f2ea;
        --accent: #ff5b2e;
      }
      * { box-sizing: border-box; }
      body {
        display: grid;
        place-items: center;
        min-height: 100vh;
        margin: 0;
        padding: 24px 16px;
        background: var(--paper);
        color: var(--ink);
        font: 400 1.0625rem/1.6 "Instrument Sans", "Segoe UI", system-ui, sans-serif;
        text-align: center;
      }
      main { max-width: 560px; }
      svg { width: 120px; height: 120px; }
      .code {
        margin: 12px 0 0;
        color: var(--ink);
        font: 800 clamp(4rem, 16vw, 7rem)/1 "Bricolage Grotesque", system-ui, sans-serif;
        letter-spacing: -0.05em;
      }
      h1 {
        margin: 8px 0 0;
        font: 800 clamp(1.5rem, 4vw, 2rem)/1.15 "Bricolage Grotesque", system-ui, sans-serif;
        letter-spacing: -0.02em;
      }
      p { margin: 14px 0 0; color: var(--ink-2); }
      .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 28px; }
      a.button {
        display: inline-flex;
        align-items: center;
        min-height: 50px;
        padding: 0 22px;
        border: 2px solid var(--ink);
        border-radius: 999px;
        background: var(--accent);
        color: var(--ink);
        font-weight: 600;
        text-decoration: none;
        box-shadow: 3px 3px 0 var(--ink);
      }
      a.button.ghost { background: transparent; box-shadow: none; }
      a.button:hover { transform: translate(-1px, -1px); box-shadow: 4px 4px 0 var(--ink); }
    </style>
  </head>
  <body>
    <main>
      <svg viewBox="0 0 48 48" aria-hidden="true">
        <path d="M4 38L18 16L30 38H4Z" fill="#14231c" opacity=".45" />
        <path d="M14 38L31 10L45 38H14Z" fill="#14231c" />
        <path d="M31 10L36 38H45L31 10Z" fill="#ff5b2e" />
      </svg>
      <p class="code">404</p>
      <h1>This page wandered off the trail.</h1>
      <p>The link may be old or mistyped. Everything else is still here.</p>
      <div class="actions">
        <a class="button" href="/">Back to the homepage</a>
        <a class="button ghost" href="/#contact">Get a free website review</a>
      </div>
    </main>
  </body>
</html>
